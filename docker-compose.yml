# Wishlist stack: "api" (Node backend + SQLite) and "web" (nginx serving the app and proxying /api + /uploads).
# Settings come from .env next to this file – see .env.example. "latest" is the newest release;
# pin a version (e.g. :1.0.0) on both images to stay on it or to roll back.
name: wishlist

services:
  api:
    image: ghcr.io/marchein/wishlist-api:latest
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed paths inside the container; the data volume holds the database and uploads.
      NODE_ENV: production
      PORT: "3000"
      DATABASE_FILE: /app/data/wishlist.db
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - data:/app/data

  web:
    image: ghcr.io/marchein/wishlist-web:latest
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WISHLIST_PORT:-8080}:8080"

volumes:
  data:
