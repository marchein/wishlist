server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Image uploads are limited to 5 MB by the API.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS; re-resolving keeps working when the api container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Link lookups may wait up to ~10 s for slow shops.
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # Shops often block hotlinked product images when a foreign Referer is sent.
        add_header Referrer-Policy "no-referrer" always;

        try_files $uri $uri/ /index.html;

        # Angular emits content-hashed bundles, so they can be cached forever.
        location ~* \.(?:js|css)$ {
            expires max;
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;
        }
    }
}
